name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: chemcheck-ci
          channels: conda-forge
          channel-priority: strict

      - name: Install conda dependencies
        shell: bash -l {0}
        run: |
          conda install -q -y python=${{ matrix.python }} rdkit pandas \
            scikit-learn scipy pyarrow openpyxl pip

      - name: Install chemcheck (dev)
        shell: bash -l {0}
        run: pip install -e ".[dev]"

      - name: Run tests
        shell: bash -l {0}
        run: python -m pytest tests -q

      - name: Lint
        shell: bash -l {0}
        run: ruff check src tests

  notebooks:
    name: notebooks execute cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: chemcheck-ci
          channels: conda-forge
          channel-priority: strict

      - name: Install conda dependencies
        shell: bash -l {0}
        run: |
          conda install -q -y python=3.11 rdkit pandas \
            scikit-learn scipy pyarrow openpyxl pip jupyter

      - name: Install chemcheck (notebooks)
        shell: bash -l {0}
        run: pip install -e ".[dev,notebooks]"

      # Execute to stdout (not --inplace) so committed outputs stay
      # byte-stable; any code change that alters findings fails the build.
      - name: Execute example notebooks
        shell: bash -l {0}
        working-directory: examples
        run: |
          for nb in 01_quickstart 02_leakage_splits 03_curation_case_study; do
            jupyter nbconvert --to notebook --execute --stdout "$nb.ipynb" > /dev/null
          done
