name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: chemcheck-ci
          channels: conda-forge
          channel-priority: strict

      - name: Install conda dependencies
        shell: bash -l {0}
        run: |
          conda install -q -y python=${{ matrix.python }} rdkit pandas \
            scipy pyarrow openpyxl pip

      - name: Install chemcheck (dev)
        shell: bash -l {0}
        run: pip install -e ".[dev]"

      - name: Run tests
        shell: bash -l {0}
        run: python -m pytest tests -q

      - name: Lint
        shell: bash -l {0}
        run: ruff check src tests validation

  minimum-dependencies:
    name: minimum supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up minimum dependency environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: chemcheck-minimum
          channels: conda-forge
          channel-priority: strict

      - name: Install declared minimums
        shell: bash -l {0}
        run: |
          conda install -q -y python=3.10 rdkit=2022.09.5 pandas=1.5.0 numpy=1.23.0 \
            scipy=1.9.0 pyarrow=10.0.1 openpyxl=3.1.0 pip
          pip install --no-deps -e .
          pip install "pytest>=7.4" "pytest-cov>=5"

      - name: Test minimum supported dependencies
        shell: bash -l {0}
        run: python -m pytest tests -q

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: chemcheck-coverage
          channels: conda-forge
          channel-priority: strict

      - name: Install chemcheck
        shell: bash -l {0}
        run: |
          conda install -q -y python=3.11 rdkit pandas scipy pyarrow openpyxl pip
          pip install -e ".[dev]"

      - name: Run branch coverage
        shell: bash -l {0}
        run: python -m pytest -q --cov=chemcheck --cov-report=term-missing --cov-report=xml

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  distribution:
    name: build and install distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and source archive
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install and smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          chemcheck --version

  notebooks:
    name: notebooks execute cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: chemcheck-ci
          channels: conda-forge
          channel-priority: strict

      - name: Install conda dependencies
        shell: bash -l {0}
        run: |
          conda install -q -y python=3.11 rdkit pandas \
            scipy pyarrow openpyxl pip jupyter

      - name: Install chemcheck (notebooks)
        shell: bash -l {0}
        run: pip install -e ".[dev,notebooks]"

      # Execute to stdout (not --inplace) so committed outputs stay
      # byte-stable; any code change that alters findings fails the build.
      - name: Execute example notebooks
        shell: bash -l {0}
        working-directory: examples
        run: |
          for nb in 01_quickstart 02_leakage_splits 03_curation_case_study; do
            jupyter nbconvert --to notebook --execute --stdout "$nb.ipynb" > /dev/null
          done
