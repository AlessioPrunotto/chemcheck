name: Publish Python distribution

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read and validate package version
        id: package
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            test "${GITHUB_REF_NAME#v}" = "$version"
          fi
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Store release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/chemcheck
    permissions:
      id-token: write
    steps:
      - name: Retrieve release artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Upload with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          print-hash: true

  verify-testpypi:
    name: Verify TestPyPI artifact
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve locally built artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: built-dist/
      - name: Download the uploaded artifacts from TestPyPI
        run: |
          mkdir testpypi-dist
          python - <<'PY'
          import json
          from pathlib import Path
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen

          version = "${{ needs.build.outputs.version }}"
          expected = {path.name for path in Path("built-dist").iterdir() if path.is_file()}
          endpoint = f"https://test.pypi.org/pypi/chemcheck/{version}/json"

          for attempt in range(10):
              try:
                  with urlopen(endpoint, timeout=30) as response:
                      release = json.load(response)
                  files = {item["filename"]: item["url"] for item in release["urls"]}
                  if expected <= files.keys():
                      for filename in expected:
                          with urlopen(files[filename], timeout=60) as response:
                              Path("testpypi-dist", filename).write_bytes(response.read())
                      break
              except (HTTPError, URLError):
                  pass
              if attempt == 9:
                  raise RuntimeError(f"TestPyPI did not expose all expected files: {sorted(expected)}")
              time.sleep(15)
          PY
      - name: Verify provenance and installation
        shell: bash
        run: |
          for built in built-dist/*; do
            cmp "$built" "testpypi-dist/$(basename "$built")"
          done
          built_wheel=$(find built-dist -name '*.whl' -print -quit)
          testpypi_wheel=$(find testpypi-dist -name '*.whl' -print -quit)
          test -n "$built_wheel"
          test -n "$testpypi_wheel"
          python -m pip install "$testpypi_wheel"
          chemcheck --version
          python -c 'import chemcheck; assert chemcheck.__version__ == "${{ needs.build.outputs.version }}"'

  publish-pypi:
    name: Publish release to PyPI
    if: github.event_name == 'release'
    needs: [build, verify-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chemcheck
    permissions:
      id-token: write
    steps:
      - name: Retrieve verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Upload with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
