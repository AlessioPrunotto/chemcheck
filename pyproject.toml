[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chemcheck"
version = "0.1.0"
description = "pytest for molecular datasets — sanity checks for chemistry ML datasets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alessio Prunotto" }]
keywords = ["cheminformatics", "molecular-machine-learning", "dataset-quality", "data-leakage", "rdkit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "rdkit>=2022.9.5",
  "pandas>=1.5",
  "numpy>=1.23",
  "scipy>=1.9",
  "pyarrow>=10.0.1",
  "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/AlessioPrunotto/chemcheck"
Repository = "https://github.com/AlessioPrunotto/chemcheck"
Issues = "https://github.com/AlessioPrunotto/chemcheck/issues"

[project.optional-dependencies]
pretty = ["rich>=13"]
dev = ["pytest>=7.4", "pytest-cov>=5", "ruff>=0.6"]
notebooks = ["jupyter>=1", "nbformat>=5.9", "nbclient>=0.8", "ipykernel>=6.25"]

[project.scripts]
chemcheck = "chemcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["chemcheck"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/F/I only. BLE/S110 intentionally excluded: checks must never crash an
# audit and RDKit raises unpredictable exception types, so broad defensive
# excepts are a design choice, not sloppiness.
select = ["E", "F", "I"]
